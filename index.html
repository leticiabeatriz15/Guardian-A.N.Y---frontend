<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian A.N.Y - Análise de Estímulo Audiovisual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#FBF0C9] text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-amber-200/60 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Guardian A.N.Y Logo" class="h-10 w-auto object-contain">
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-slate-900">GUARDIAN <span class="text-amber-700">A.N.Y</span></h1>
                    <p class="text-xs text-slate-600">Classificação e Acessibilidade Audiovisual</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <div class="relative w-full sm:w-64">
                    <input type="text" id="searchBar" placeholder="Buscar vídeo..." class="w-full bg-white/90 text-sm text-slate-800 pl-10 pr-4 py-2 rounded-lg border border-amber-200 focus:outline-none focus:border-amber-500 transition-colors">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                </div>
                <select id="filterSelect" class="bg-white/90 text-sm text-slate-700 px-3 py-2 rounded-lg border border-amber-200 focus:outline-none focus:border-amber-500 transition-colors cursor-pointer w-full sm:w-auto">
                    <option value="todos">Todos os Estímulos</option>
                    <option value="HIPERESTIMULANTE">Hiperestimulante</option>
                    <option value="ESTÍMULO MODERADO">Estímulo Moderado</option>
                    <option value="BAIXO ESTÍMULO">Baixo Estímulo</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">
        <!-- Dashboard / Métricas -->
        <div class="mb-8 bg-white/70 rounded-xl p-6 border border-amber-200 shadow-sm flex flex-wrap justify-around text-center gap-4">
            <div>
                <p class="text-slate-600 text-sm font-medium">Total Analisado</p>
                <p id="totalCount" class="text-2xl font-bold text-slate-800">0</p>
            </div>
            <div class="border-r border-amber-200 hidden md:block"></div>
            <div>
                <p class="text-[#d35400] text-sm font-medium">Hiperestimulantes</p>
                <p id="hiperCount" class="text-2xl font-bold text-[#d35400]">0</p>
            </div>
            <div class="border-r border-amber-200 hidden md:block"></div>
            <div>
                <p class="text-amber-700 text-sm font-medium">Estímulo Moderado</p>
                <p id="moderadoCount" class="text-2xl font-bold text-amber-700">0</p>
            </div>
            <div class="border-r border-amber-200 hidden md:block"></div>
            <div>
                <p class="text-emerald-700 text-sm font-medium">Baixo Estímulo</p>
                <p id="baixoCount" class="text-2xl font-bold text-emerald-700">0</p>
            </div>
        </div>

        <!-- Grid de Vídeos -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>

        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-regular fa-folder-open text-slate-400 text-5xl mb-3"></i>
            <p class="text-slate-600">Nenhum vídeo encontrado para os filtros selecionados.</p>
        </div>
    </main>

    <footer class="bg-white/60 border-t border-amber-200/60 py-4 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-600">
            &copy; 2026 Guardian A.N.Y. Todos os direitos reservados.
        </div>
    </footer>
   
    <script>
        function obterThumbnailYoutube(url) {
            let videoId = "";
            if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
            } else if (url.includes("watch?v=")) {
                videoId = url.split("watch?v=")[1].split("&")[0];
            }
            return videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=500';
        }

        function obterEstiloCard(classificacao) {
            const classeBadgeBase = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm";
            
            switch((classificacao || "").toUpperCase()) {
                case "HIPERESTIMULANTE":
                    return {
                        bgCard: "bg-[#FB8A57] border-red-300/60",
                        badge: `${classeBadgeBase} bg-red-950/20 text-slate-900 border border-red-900/20`,
                        icone: "fa-bolt"
                    };
                case "BAIXO ESTÍMULO":
                    return {
                        bgCard: "bg-[#7ACE9A] border-emerald-300/60",
                        badge: `${classeBadgeBase} bg-emerald-950/20 text-slate-900 border border-emerald-900/20`,
                        icone: "fa-leaf"
                    };
                default:
                    return {
                        bgCard: "bg-[#FFEB87] border-amber-300/60",
                        badge: `${classeBadgeBase} bg-amber-950/20 text-slate-900 border border-amber-900/20`,
                        icone: "fa-eye"
                    };
            }
        }

        const videoGrid = document.getElementById("videoGrid");
        const emptyState = document.getElementById("emptyState");
        const searchBar = document.getElementById("searchBar");
        const filterSelect = document.getElementById("filterSelect");
        let datasetVideos = [];

        async function carregarVideos() {
            try {
                const resposta = await fetch("dataset_front.json");
                datasetVideos = await resposta.json();

                atualizarDashboard(datasetVideos);
                renderizarGrid(datasetVideos);
            } catch (erro) {
                console.error("Erro ao carregar dataset:", erro);
            }
        }

        function renderizarGrid(videos) {
            videoGrid.innerHTML = "";
            
            if(videos.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            }
            emptyState.classList.add("hidden");

            videos.forEach(video => {
                const thumbUrl = obterThumbnailYoutube(video.url);
                const estilo = obterEstiloCard(video.classificacao);

                const cardHTML = `
                    <a href="${video.url}" target="_blank"
                    class="group ${estilo.bgCard} rounded-xl overflow-hidden border shadow-sm hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 flex flex-col">

                        <div class="relative aspect-video w-full overflow-hidden bg-black/10">
                            <img src="${thumbUrl}"
                                class="w-full h-full object-cover scale-[1.35] group-hover:scale-[1.40] transition-transform duration-500">

                            <div class="absolute inset-0 bg-slate-900/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                                <div class="bg-slate-900/80 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg">
                                    <i class="fa-solid fa-play text-white ml-1"></i>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 flex flex-col gap-3 flex-grow justify-between">

                            <h3 class="text-sm font-bold text-slate-900 line-clamp-2 leading-snug">
                                ${video.titulo}
                            </h3>

                            <div>
                                <p class="text-[11px] text-slate-700 font-semibold mb-1 uppercase tracking-wider">
                                    Classificação
                                </p>

                                <span class="${estilo.badge}">
                                    <i class="fa-solid ${estilo.icone}"></i>
                                    ${video.classificacao}
                                </span>
                            </div>

                        </div>

                    </a>
                    `;
                videoGrid.insertAdjacentHTML("beforeend", cardHTML);
            });
        }

        function atualizarDashboard(videos){
            document.getElementById("totalCount").innerText = videos.length;

            document.getElementById("hiperCount").innerText =
                videos.filter(v => (v.classificacao || "").toUpperCase() === "HIPERESTIMULANTE").length;

            document.getElementById("moderadoCount").innerText =
                videos.filter(v => (v.classificacao || "").toUpperCase() === "ESTÍMULO MODERADO").length;

            document.getElementById("baixoCount").innerText =
                videos.filter(v => (v.classificacao || "").toUpperCase() === "BAIXO ESTÍMULO").length;
        }

        function filtrarVideos() {
            const termoBusca = searchBar.value.toLowerCase();
            const filtroSelecionado = filterSelect.value;

            const videosFiltrados = datasetVideos.filter(video => {
                const bateBusca = video.titulo.toLowerCase().includes(termoBusca);
                const bateFiltro =
                    filtroSelecionado === "todos" ||
                    (video.classificacao || "").toUpperCase() === filtroSelecionado.toUpperCase();
                return bateBusca && bateFiltro;
            });

            renderizarGrid(videosFiltrados);
        }

        searchBar.addEventListener("input", filtrarVideos);
        filterSelect.addEventListener("change", filtrarVideos);

        carregarVideos();
    </script>
</body>
</html>
