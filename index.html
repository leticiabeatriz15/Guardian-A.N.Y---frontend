<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian A.N.Y - Análise de Estímulo Audiovisual</title>
    
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#FBF0C9] text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-amber-200/60 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Guardian A.N.Y Logo" class="h-14 w-auto object-contain">
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-slate-900">GUARDIAN <span class="text-amber-700">A.N.Y</span></h1>
                    <p class="text-xs text-slate-600">Menos sobrecarga. Mais bem-estar</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <div class="relative w-full sm:w-64">
                    <input type="text" id="searchBar" placeholder="Buscar vídeo..." class="w-full bg-white/90 text-sm text-slate-800 pl-10 pr-4 py-2 rounded-lg border border-amber-200 focus:outline-none focus:border-amber-500 transition-colors">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                </div>
                <select id="filterSelect" class="bg-white/90 text-sm text-slate-700 px-3 py-2 rounded-lg border border-amber-200 focus:outline-none focus:border-amber-500 transition-colors cursor-pointer w-full sm:w-auto">
                    <option value="todos">Todos os Estímulos</option>
                    <option value="HIPERESTIMULANTE">Hiperestimulante</option>
                    <option value="ESTÍMULO MODERADO">Estímulo Moderado</option>
                    <option value="BAIXO ESTÍMULO">Baixo Estímulo</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">
        
        <!-- Formulário para Analisar Novo Vídeo -->
        <div class="mb-8 bg-white/80 rounded-xl p-6 border border-amber-200 shadow-sm">
            <h2 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-600"></i> Analisar Novo Vídeo com IA
            </h2>
            <form id="formAnalise" class="flex flex-col sm:flex-row gap-3">
                <input type="url" id="inputUrl" placeholder="Cole aqui a URL do vídeo do YouTube (ex: https://www.youtube.com/watch?v=...)" 
                       required class="flex-grow bg-white text-sm text-slate-800 px-4 py-3 rounded-lg border border-amber-200 focus:outline-none focus:border-amber-500 shadow-inner">
                <button type="submit" id="btnAnalisar" class="bg-amber-600 hover:bg-amber-700 text-white text-sm font-bold px-6 py-3 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-microchip"></i>
                    <span>Analisar Vídeo</span>
                </button>
            </form>
            <!-- Mensagem de Status/Loading -->
            <div id="statusAnalise" class="hidden mt-3 text-sm flex items-center gap-2 font-medium"></div>
        </div>

        <!-- Dashboard / Métricas -->
        <div class="mb-8 bg-white/70 rounded-xl p-6 border border-amber-200 shadow-sm flex flex-wrap justify-around text-center gap-4">
            <div>
                <p class="text-slate-600 text-sm font-medium">Total Analisado</p>
                <p id="totalCount" class="text-2xl font-bold text-slate-800">0</p>
            </div>
            <div class="border-r border-amber-200 hidden md:block"></div>
            <div>
                <p class="text-[#d35400] text-sm font-medium">Hiperestimulantes</p>
                <p id="hiperCount" class="text-2xl font-bold text-[#d35400]">0</p>
            </div>
            <div class="border-r border-amber-200 hidden md:block"></div>
            <div>
                <p class="text-amber-700 text-sm font-medium">Estímulo Moderado</p>
                <p id="moderadoCount" class="text-2xl font-bold text-amber-700">0</p>
            </div>
            <div class="border-r border-amber-200 hidden md:block"></div>
            <div>
                <p class="text-emerald-700 text-sm font-medium">Baixo Estímulo</p>
                <p id="baixoCount" class="text-2xl font-bold text-emerald-700">0</p>
            </div>
        </div>

        <!-- Grid de Vídeos -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>

        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-regular fa-folder-open text-slate-400 text-5xl mb-3"></i>
            <p class="text-slate-600">Nenhum vídeo encontrado para os filtros selecionados.</p>
        </div>
    </main>

    <footer class="bg-white/60 border-t border-amber-200/60 py-4 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-600">
            &copy; 2026 Guardian A.N.Y. Todos os direitos reservados.
        </div>
    </footer>
   
    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
