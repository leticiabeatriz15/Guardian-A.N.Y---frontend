<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian A.N.Y - Análise de Estímulo Audiovisual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <header class="bg-gray-800 border-b border-gray-700 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-lg shadow-md shadow-indigo-500/20">
                    <i class="fa-solid font-bold fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-white">GUARDIAN <span class="text-indigo-500">A.N.Y</span></h1>
                    <p class="text-xs text-gray-400">Classificação e Acessibilidade Audiovisual</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <div class="relative w-full sm:w-64">
                    <input type="text" id="searchBar" placeholder="Buscar vídeo..." class="w-full bg-gray-700 text-sm text-gray-200 pl-10 pr-4 py-2 rounded-lg border border-gray-600 focus:outline-none focus:border-indigo-500 transition-colors">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                </div>
                <select id="filterSelect" class="bg-gray-700 text-sm text-gray-200 px-3 py-2 rounded-lg border border-gray-600 focus:outline-none focus:border-indigo-500 transition-colors cursor-pointer w-full sm:w-auto">
                    <option value="todos">Todos os Estímulos</option>
                    <option value="HIPERESTIMULANTE">Hiperestimulante</option>
                    <option value="ESTÍMULO MODERADO">Estímulo Moderado</option>
                    <option value="BAIXO ESTÍMULO">Baixo Estímulo</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">
        <div class="mb-8 bg-gray-800/50 rounded-xl p-6 border border-gray-700/60 flex flex-wrap justify-around text-center gap-4">
            <div>
                <p class="text-gray-400 text-sm">Total Analisado</p>
                <p id="totalCount" class="text-2xl font-bold text-white">0</p>
            </div>
            <div class="border-r border-gray-700 hidden md:block"></div>
            <div>
                <p class="text-red-400 text-sm">Hiperestimulantes</p>
                <p id="hiperCount" class="text-2xl font-bold text-red-500">0</p>
            </div>
            <div class="border-r border-gray-700 hidden md:block"></div>
            <div>
                <p class="text-yellow-400 text-sm">Estímulo Moderado</p>
                <p id="moderadoCount" class="text-2xl font-bold text-yellow-500">0</p>
            </div>
            <div class="border-r border-gray-700 hidden md:block"></div>
            <div>
                <p class="text-green-400 text-sm">Baixo Estímulo</p>
                <p id="baixoCount" class="text-2xl font-bold text-green-500">0</p>
            </div>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>

        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-regular fa-folder-open text-gray-600 text-5xl mb-3"></i>
            <p class="text-gray-400">Nenhum vídeo encontrado para os filtros selecionados.</p>
        </div>
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 py-4 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
            &copy; 2026 Guardian A.N.Y. Todos os direitos reservados.
        </div>
    </footer>
   
    <script>
        // Função auxiliar para extrair o ID do YouTube e gerar a URL da capa (Thumbnail)
        function obterThumbnailYoutube(url) {
            let videoId = "";
            if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
            } else if (url.includes("watch?v=")) {
                videoId = url.split("watch?v=")[1].split("&")[0];
            }
            // Retorna a imagem em alta definição padrão do YouTube
            return videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=500';
        }

        // Função para estilizar os Badges dinamicamente baseado na classificação
        function obterEstiloBadge(classificacao) {
            const classeBase = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm";
            switch(classificacao.toUpperCase()) {
                case "HIPERESTIMULANTE":
                    return { classe: `${classeBase} bg-red-900/40 text-red-400 border border-red-700/50`, icone: "fa-bolt" };
                case "BAIXO ESTÍMULO":
                    return { classe: `${classeBase} bg-green-900/40 text-green-400 border border-green-700/50`, icone: "fa-leaf" };
                default:
                    return { classe: `${classeBase} bg-yellow-900/40 text-yellow-400 border border-yellow-700/50`, icone: "fa-eye" };
            }
        }

        

        const videoGrid = document.getElementById("videoGrid");
        const emptyState = document.getElementById("emptyState");
        const searchBar = document.getElementById("searchBar");
        const filterSelect = document.getElementById("filterSelect");
        let datasetVideos = [];

        async function carregarVideos() {
            try {
                const resposta = await fetch("dataset_front.json");
                datasetVideos = await resposta.json();

                atualizarDashboard(datasetVideos);
                renderizarGrid(datasetVideos);
            } catch (erro) {
                console.error("Erro ao carregar dataset:", erro);
            }
        }
        // Função Principal de Renderização
        function renderizarGrid(videos) {
            videoGrid.innerHTML = "";
            
            if(videos.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            }
            emptyState.classList.add("hidden");

            videos.forEach(video => {
                const thumbUrl = obterThumbnailYoutube(video.url);
               const classificacao =
                    video.classificacao_algoritmo !== "ERRO NO DOWNLOAD"
                        ? video.classificacao_algoritmo
                        : video.classificacao_csv;

                const badgeInfo = obterEstiloBadge(classificacao);

                const cardHTML = `
                    <a href="${video.url}" target="_blank"
                    class="group bg-gray-800 rounded-xl overflow-hidden border border-gray-700/50 hover:border-indigo-500/50 shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 flex flex-col">

                        <div class="relative aspect-video">
                            <img src="${thumbUrl}"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">

                            <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                                <div class="bg-indigo-600 w-12 h-12 rounded-full flex items-center justify-center">
                                    <i class="fa-solid fa-play text-white ml-1"></i>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 flex flex-col gap-3 flex-grow">

                            <h3 class="text-sm font-semibold line-clamp-2">
                                ${video.titulo}
                            </h3>

                            <div>

                                <p class="text-xs text-gray-400 mb-1">
                                    Resultado da análise
                                </p>

                                <span class="${badgeInfo.classe}">
                                    <i class="fa-solid ${badgeInfo.icone}"></i>
                                    ${classificacao}
                                </span>

                            </div>

                            <div class="text-xs text-gray-400">

                                <p>
                                    CSV:
                                    <span class="text-white">
                                        ${video.classificacao_csv}
                                    </span>
                                </p>

                                <p>
                                    Algoritmo:
                                    <span class="text-white">
                                        ${video.classificacao_algoritmo}
                                    </span>
                                </p>

                                <p class="mt-1 font-semibold
                                    ${video.resultado === "CORRETO (Bateu com o CSV)" ? "text-green-400" :
                                    video.resultado === "DIVERGENTE" ? "text-yellow-400" :
                                    "text-red-400"}">

                                    ${video.resultado}

                                </p>

                            </div>

                        </div>

                    </a>
                    `;
                videoGrid.insertAdjacentHTML("beforeend", cardHTML);
            });
        }

        // Atualiza os contadores do mini dashboard
        function atualizarDashboard(videos){

            document.getElementById("totalCount").innerText = videos.length;

            const classificacoes = videos.map(v =>
                v.classificacao_algoritmo !== "ERRO NO DOWNLOAD"
                    ? v.classificacao_algoritmo
                    : v.classificacao_csv
            );

            document.getElementById("hiperCount").innerText =
                classificacoes.filter(c => c === "HIPERESTIMULANTE").length;

            document.getElementById("moderadoCount").innerText =
                classificacoes.filter(c => c === "ESTÍMULO MODERADO").length;

            document.getElementById("baixoCount").innerText =
                classificacoes.filter(c => c === "BAIXO ESTÍMULO").length;
        }

        // Filtragem e Busca em tempo real
        function filtrarVideos() {
            const termoBusca = searchBar.value.toLowerCase();
            const filtroSelecionado = filterSelect.value;

            const videosFiltrados = datasetVideos.filter(video => {
                const bateBusca = video.titulo.toLowerCase().includes(termoBusca);
                const classificacao =
    video.classificacao_algoritmo !== "ERRO NO DOWNLOAD"
        ? video.classificacao_algoritmo
        : video.classificacao_csv;

            const bateFiltro =
                filtroSelecionado === "todos" ||
                classificacao.toUpperCase() === filtroSelecionado.toUpperCase();
                            return bateBusca && bateFiltro;
                        });

            renderizarGrid(videosFiltrados);
        }

        searchBar.addEventListener("input", filtrarVideos);
        filterSelect.addEventListener("change", filtrarVideos);

        // Inicialização da Página
        carregarVideos();
    </script>
</body>
</html>
