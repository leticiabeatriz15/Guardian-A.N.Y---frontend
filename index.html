<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian A.N.Y - Análise de Estímulo Audiovisual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header claro -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- Logo e Título -->
            <div class="flex items-center gap-3">
                <!-- Imagem PNG do Logo (substitua 'logo.png' pelo caminho/nome do seu arquivo) -->
                <div class="w-12 h-12 flex items-center justify-center rounded-lg overflow-hidden border border-slate-100 bg-slate-50 p-1">
                    <img src="logo.png" alt="Guardian A.N.Y Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-slate-900">GUARDIAN <span class="text-indigo-600">A.N.Y</span></h1>
                    <p class="text-xs text-slate-500">Classificação e Acessibilidade Audiovisual</p>
                </div>
            </div>
            
            <!-- Controles de busca e filtro -->
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <div class="relative w-full sm:w-64">
                    <input type="text" id="searchBar" placeholder="Buscar vídeo..." class="w-full bg-slate-100 text-sm text-slate-800 pl-10 pr-4 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                </div>
                <select id="filterSelect" class="bg-slate-100 text-sm text-slate-700 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors cursor-pointer w-full sm:w-auto">
                    <option value="todos">Todos os Estímulos</option>
                    <option value="HIPERESTIMULANTE">Hiperestimulante</option>
                    <option value="ESTÍMULO MODERADO">Estímulo Moderado</option>
                    <option value="BAIXO ESTÍMULO">Baixo Estímulo</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">
        <!-- Dashboard / Métricas -->
        <div class="mb-8 bg-white rounded-xl p-6 border border-slate-200 shadow-sm flex flex-wrap justify-around text-center gap-4">
            <div>
                <p class="text-slate-500 text-sm font-medium">Total Analisado</p>
                <p id="totalCount" class="text-2xl font-bold text-slate-800">0</p>
            </div>
            <div class="border-r border-slate-200 hidden md:block"></div>
            <div>
                <p class="text-red-500 text-sm font-medium">Hiperestimulantes</p>
                <p id="hiperCount" class="text-2xl font-bold text-red-600">0</p>
            </div>
            <div class="border-r border-slate-200 hidden md:block"></div>
            <div>
                <p class="text-amber-500 text-sm font-medium">Estímulo Moderado</p>
                <p id="moderadoCount" class="text-2xl font-bold text-amber-600">0</p>
            </div>
            <div class="border-r border-slate-200 hidden md:block"></div>
            <div>
                <p class="text-emerald-500 text-sm font-medium">Baixo Estímulo</p>
                <p id="baixoCount" class="text-2xl font-bold text-emerald-600">0</p>
            </div>
        </div>

        <!-- Grid de Vídeos -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>

        <!-- Estado Vazio -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-regular fa-folder-open text-slate-300 text-5xl mb-3"></i>
            <p class="text-slate-500">Nenhum vídeo encontrado para os filtros selecionados.</p>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            &copy; 2026 Guardian A.N.Y. Todos os direitos reservados.
        </div>
    </footer>
   
    <script>
        // Função auxiliar para extrair o ID do YouTube e gerar a URL da capa (Thumbnail)
        function obterThumbnailYoutube(url) {
            let videoId = "";
            if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
            } else if (url.includes("watch?v=")) {
                videoId = url.split("watch?v=")[1].split("&")[0];
            }
            return videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=500';
        }

        // Função para estilizar os Badges dinamicamente baseado na classificação (versão clara)
        function obterEstiloBadge(classificacao) {
            const classeBase = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm";
            switch(classificacao.toUpperCase()) {
                case "HIPERESTIMULANTE":
                    return { classe: `${classeBase} bg-red-100 text-red-700 border border-red-200`, icone: "fa-bolt" };
                case "BAIXO ESTÍMULO":
                    return { classe: `${classeBase} bg-emerald-100 text-emerald-700 border border-emerald-200`, icone: "fa-leaf" };
                default:
                    return { classe: `${classeBase} bg-amber-100 text-amber-700 border border-amber-200`, icone: "fa-eye" };
            }
        }

        const videoGrid = document.getElementById("videoGrid");
        const emptyState = document.getElementById("emptyState");
        const searchBar = document.getElementById("searchBar");
        const filterSelect = document.getElementById("filterSelect");
        let datasetVideos = [];

        async function carregarVideos() {
            try {
                const resposta = await fetch("dataset_front.json");
                datasetVideos = await resposta.json();

                atualizarDashboard(datasetVideos);
                renderizarGrid(datasetVideos);
            } catch (erro) {
                console.error("Erro ao carregar dataset:", erro);
            }
        }

        // Função Principal de Renderização
        function renderizarGrid(videos) {
            videoGrid.innerHTML = "";
            
            if(videos.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            }
            emptyState.classList.add("hidden");

            videos.forEach(video => {
                const thumbUrl = obterThumbnailYoutube(video.url);
                const classificacao =
                    video.classificacao_algoritmo !== "ERRO NO DOWNLOAD"
                        ? video.classificacao_algoritmo
                        : video.classificacao_csv;

                const badgeInfo = obterEstiloBadge(classificacao);

                const cardHTML = `
                    <a href="${video.url}" target="_blank"
                    class="group bg-white rounded-xl overflow-hidden border border-slate-200 hover:border-indigo-400 shadow-sm hover:shadow-md transition-all duration-300 transform hover:-translate-y-1 flex flex-col">

                        <div class="relative aspect-video bg-slate-100">
                            <img src="${thumbUrl}"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">

                            <div class="absolute inset-0 bg-slate-900/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                                <div class="bg-indigo-600 w-12 h-12 rounded-full flex items-center justify-center shadow-lg">
                                    <i class="fa-solid fa-play text-white ml-1"></i>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 flex flex-col gap-3 flex-grow justify-between">

                            <h3 class="text-sm font-semibold text-slate-800 line-clamp-2 leading-snug">
                                ${video.titulo}
                            </h3>

                            <div class="flex flex-col gap-2">
                                <div>
                                    <p class="text-[11px] text-slate-400 font-medium mb-1 uppercase tracking-wider">
                                        Resultado da análise
                                    </p>

                                    <span class="${badgeInfo.classe}">
                                        <i class="fa-solid ${badgeInfo.icone}"></i>
                                        ${classificacao}
                                    </span>
                                </div>

                                <div class="text-xs text-slate-500 pt-2 border-t border-slate-100 space-y-0.5">
                                    <p>
                                        CSV: <span class="font-medium text-slate-700">${video.classificacao_csv}</span>
                                    </p>
                                    <p>
                                        Algoritmo: <span class="font-medium text-slate-700">${video.classificacao_algoritmo}</span>
                                    </p>
                                    <p class="mt-1 font-semibold ${video.resultado === "CORRETO (Bateu com o CSV)" ? "text-emerald-600" : video.resultado === "DIVERGENTE" ? "text-amber-600" : "text-red-600"}">
                                        ${video.resultado}
                                    </p>
                                </div>
                            </div>

                        </div>

                    </a>
                    `;
                videoGrid.insertAdjacentHTML("beforeend", cardHTML);
            });
        }

        // Atualiza os contadores do mini dashboard
        function atualizarDashboard(videos){
            document.getElementById("totalCount").innerText = videos.length;

            const classificacoes = videos.map(v =>
                v.classificacao_algoritmo !== "ERRO NO DOWNLOAD"
                    ? v.classificacao_algoritmo
                    : v.classificacao_csv
            );

            document.getElementById("hiperCount").innerText =
                classificacoes.filter(c => c === "HIPERESTIMULANTE").length;

            document.getElementById("moderadoCount").innerText =
                classificacoes.filter(c => c === "ESTÍMULO MODERADO").length;

            document.getElementById("baixoCount").innerText =
                classificacoes.filter(c => c === "BAIXO ESTÍMULO").length;
        }

        // Filtragem e Busca em tempo real
        function filtrarVideos() {
            const termoBusca = searchBar.value.toLowerCase();
            const filtroSelecionado = filterSelect.value;

            const videosFiltrados = datasetVideos.filter(video => {
                const bateBusca = video.titulo.toLowerCase().includes(termoBusca);
                const classificacao =
                    video.classificacao_algoritmo !== "ERRO NO DOWNLOAD"
                        ? video.classificacao_algoritmo
                        : video.classificacao_csv;

                const bateFiltro =
                    filtroSelecionado === "todos" ||
                    classificacao.toUpperCase() === filtroSelecionado.toUpperCase();
                return bateBusca && bateFiltro;
            });

            renderizarGrid(videosFiltrados);
        }

        searchBar.addEventListener("input", filtrarVideos);
        filterSelect.addEventListener("change", filtrarVideos);

        // Inicialização da Página
        carregarVideos();
    </script>
</body>
</html>
